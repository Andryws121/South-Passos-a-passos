<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Passos - South</title>
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2 class="login-title">Acesso Restrito</h2>
            <p class="login-subtitle">Insira a password para aceder ao sistema.</p>
            <div class="password-wrapper">
                <input type="password" id="senhaAdmin" placeholder="Password de acesso">
                <span id="togglePassword" class="password-toggle" onclick="alternarSenha()">Mostrar</span>
            </div>
            <p id="erroSenha" class="login-error-message hidden">Password incorreta!</p>
            <button class="btn-login" onclick="verificarAcesso()">Entrar no Sistema</button>
        </div>
    </div>

    <div class="main-wrapper hidden">
        <header class="header-south">
            <div class="header-left">
                <h1>Central de Passo a Passo</h1>
            </div>
            <div class="botoes-topo">
                <button class="btn-back" onclick="window.history.back()">Voltar</button>
                <button class="btn-logout" onclick="sairDoSistema()">Sair</button>
            </div>
        </header>

        <div class="container">
            <div class="left-column">
                <div class="card">
                    <h3 id="formTitle">Cadastrar Novo Processo</h3>
                    
                    <label class="form-label">Empresa / Integração</label>
                    <select id="empresaCadastro">
                        <option value="Plamev">Plamev</option>
                        <option value="Aeasy">Aeasy</option>
                        <option value="Premium">Premium</option>
                        <option value="Meep">Meep</option>
                    </select>
                    
                    <label class="form-label">Título do Passo a Passo</label>
                    <input type="text" id="tituloProcesso" placeholder="Ex: Tutorial para cadastro de Modelos">

                    <label class="form-label">Descrição Detalhada</label>
                    <div id="editor-container" style="height: 250px; background: white;"></div>

                    <button id="saveUpdateBtn" class="btn-save" onclick="handleSaveUpdate()">Salvar no Sistema</button>
                    <button id="cancelEditBtn" class="btn-cancel hidden" onclick="cancelarEdicao()">Cancelar Edição</button>
                </div>
            </div>

            <div class="right-column">
                <div class="card card-filters">
                    <div class="filtros-container">
                        <div class="filter-group">
                            <label>Filtrar por Empresa</label>
                            <select id="filtroEmpresa" onchange="renderizarLista()">
                                <option value="todos">Nenhuma selecionada (Escolha uma opção)</option>
                                <option value="Plamev">Plamev</option>
                                <option value="Aeasy">Aeasy</option>
                                <option value="Premium">Premium</option>
                                <option value="Meep">Meep</option>
                            </select>
                        </div>
                        <div class="filter-group-large">
                            <label>Pesquisar Título</label>
                            <input type="text" id="buscaProcesso" onkeyup="renderizarLista()" placeholder="Procurar passo a passo...">
                        </div>
                    </div>
                </div>

                <div id="listaContainer"></div>
            </div>
        </div>
    </div>

    <div id="modalVisualizar" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" onclick="fecharModal()">&times;</span>
            <div class="modal-header">
                <span id="modalTag" class="tag"></span>
            </div>
            <h2 id="modalTitulo"></h2>
            
            <div id="modalDescricao" class="modal-body"></div>
            
            <button class="btn-copy" onclick="copiarConteudo()">Copiar Texto Simples</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
